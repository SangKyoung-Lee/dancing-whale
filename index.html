/* Apple 스타일: 파치먼트 바탕 + 흰 카드 + 단일 Action Blue. 고래는 무광 타일 위의 '제품', 그림자는 고래에만 */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#F5F5F7; --pearl-btn:#FAFAFC; --ink:#1D1D1F; --ink-80:#333333; --muted:#6E6E73; --muted-48:#7A7A7A;
  --line:rgba(0,0,0,.08); --hair:#E0E0E0; --sea:#0066CC; --sea-focus:#0071E3; --sea-ink:#FFFFFF; --sea-soft:rgba(0,102,204,.08);
  --pearl:#C9A227; --tile:#272729; --tile-ink:#FFFFFF; --tile-muted:#CCCCCC; --whale:#3D8BC4; --belly:#D7EAF5; --good:#248A3D;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r-sm:8px; --r-md:11px; --r-lg:18px; --pill:9999px;
  --product-shadow:drop-shadow(3px 5px 30px rgba(0,0,0,.22));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --pearl-btn:#2C2C2E; --ink:#F5F5F7; --ink-80:#E5E5EA; --muted:#A1A1A6; --muted-48:#8E8E93;
  --line:rgba(255,255,255,.12); --hair:#38383A; --sea:#2997FF; --sea-focus:#2997FF; --sea-ink:#FFFFFF; --sea-soft:rgba(41,151,255,.14);
  --pearl:#D4B04A; --tile:#2A2A2C; --whale:#5AA6DB; --belly:#24465C; --good:#30D158; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --pearl-btn:#2C2C2E; --ink:#F5F5F7; --ink-80:#E5E5EA; --muted:#A1A1A6; --muted-48:#8E8E93;
  --line:rgba(255,255,255,.12); --hair:#38383A; --sea:#2997FF; --sea-focus:#2997FF; --sea-ink:#FFFFFF; --sea-soft:rgba(41,151,255,.14);
  --pearl:#D4B04A; --tile:#2A2A2C; --whale:#5AA6DB; --belly:#24465C; --good:#30D158; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.47;letter-spacing:-.022em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0;font-family:var(--font-display);font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--sea-focus);outline-offset:2px}

/* 상단 내비 (frosted) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.top>*{max-width:440px}
.brand{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-.022em;color:var(--ink);flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--pill);background:var(--surface);border:1px solid var(--line);font-size:13px;letter-spacing:-.01em;color:var(--ink-80);white-space:nowrap}
.pearl-dot{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 22%,var(--pearl) 70%);flex:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.proto{font-size:12px;line-height:1.4;letter-spacing:-.01em;color:var(--muted-48);text-align:center}
.large-title{font-size:34px;line-height:1.12;letter-spacing:-.025em;margin-top:6px}

/* 카드 (store-utility-card) */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:-.016em;color:var(--muted)}
.muted{color:var(--muted);font-size:14px;line-height:1.43;letter-spacing:-.016em}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-title{font-size:21px;line-height:1.19;letter-spacing:-.012em;font-weight:600}
.note{font-size:12px;line-height:1.5;letter-spacing:-.01em;color:var(--muted-48)}

/* 버튼: 알약 + 눌림 축소 */
.btn{border:0;border-radius:var(--pill);padding:11px 22px;font-size:17px;font-weight:400;letter-spacing:-.022em;background:var(--sea);color:var(--sea-ink);transition:transform .12s ease}
.btn:active{transform:scale(.95)}
.btn.ghost{background:transparent;border:1px solid var(--sea);color:var(--sea)}
.btn.small{padding:7px 15px;font-size:14px;letter-spacing:-.016em}
.btn:disabled{background:var(--surface-2);color:var(--muted-48);border-color:transparent;cursor:default;transform:none}
.backlink{border:0;background:transparent;color:var(--sea);font-size:17px;padding:0;align-self:flex-start}

/* 칭찬하기 */
.question{font-size:28px;line-height:1.18;letter-spacing:-.02em;font-weight:600}
.progress{height:4px;background:var(--surface-2);border-radius:var(--pill);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--sea);border-radius:var(--pill);transition:width .4s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ac{position:relative;display:flex;flex-direction:column;gap:8px}
.ac-box{display:flex;align-items:center;gap:10px;border:1px solid var(--hair);border-radius:var(--r-md);background:var(--surface);padding:0 14px}
.ac-box:focus-within{border:2px solid var(--sea-focus);padding:0 13px}
.ac-box svg{flex:none;color:var(--muted)}
.ac-box input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;padding:14px 0;color:var(--ink);outline:none}
.ac-list{list-style:none;margin:0;padding:6px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.08);max-height:264px;overflow:auto}
.ac-list:empty{display:none}
.ac-list li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer}
.ac-list li[aria-selected="true"],.ac-list li:hover{background:var(--surface-2)}
.ac-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;letter-spacing:-.02em;font-weight:600;color:#fff;flex:none}
.ac-list .nm{display:flex;flex-direction:column;gap:1px;min-width:0}
.ac-list .nm b{font-size:16px;font-weight:500}.ac-list .nm b mark{background:none;color:var(--sea);font-weight:700}
.ac-list .nm span{font-size:13px;color:var(--muted)}
.ac-list .none{cursor:default;flex-direction:column;align-items:flex-start;gap:8px;padding:12px}
.ac-list .none:hover{background:none}
.picked-chip{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);border:2px solid var(--sea-focus);background:var(--sea-soft)}
.picked-chip .nm{flex:1;display:flex;flex-direction:column}
.picked-chip .nm b{font-size:17px}
.picked-chip .nm span{font-size:13px;color:var(--muted)}
.picked-chip .x{width:30px;height:30px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);font-size:18px}
.rel{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r-md);background:var(--surface-2)}
.rel-h{font-size:19px;font-weight:600;letter-spacing:-.02em}
.rel-h b{color:var(--sea)}
.rel-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rel-opts button{border:1px solid var(--hair);background:var(--surface);border-radius:var(--pill);padding:10px 4px;font-size:15px;color:var(--ink)}
.rel-opts button[aria-checked="true"]{border:2px solid var(--sea-focus);padding:9px 3px;color:var(--sea);font-weight:600;background:var(--sea-soft)}
.opt{border:1px solid var(--hair);background:var(--surface);border-radius:var(--r-lg);padding:16px 10px;text-align:center;font-size:17px;font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center;transition:transform .12s ease}
.opt:active{transform:scale(.97)}
.opt small{font-weight:400;color:var(--muted);font-size:12px}
.opt.picked{border:2px solid var(--sea-focus);padding:15px 9px}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2)}
.toggle input{width:20px;height:20px;accent-color:var(--sea);flex:none}
.toggle label{flex:1;font-size:15px;line-height:1.35}

/* 리스트 */
.list{display:flex;flex-direction:column;gap:0}
.praise{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.praise:last-child{border-bottom:0}
.praise .q{font-weight:600;font-size:16px;line-height:1.35;min-width:0}
.praise .meta{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tag{font-size:12px;padding:3px 10px;border-radius:var(--pill);background:var(--surface-2);color:var(--ink-80);white-space:nowrap;letter-spacing:-.01em}
.tag.pearl{background:var(--surface-2)}
.tag.new{background:var(--sea-soft);color:var(--sea);font-weight:600}

/* 고래 무대: 무광 타일 위의 제품 */
.stage{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:4/3.2;max-width:100%;display:flex;align-items:center;justify-content:center;color:var(--tile-ink)}
.stage.tropic{background:#272729}
.stage.polar{background:#F5F5F7;color:#1D1D1F}
.stage.night{background:#000}
.stage .stars{position:absolute;inset:0;background-image:radial-gradient(1.4px 1.4px at 18% 22%,#ffffffb0 99%,transparent),radial-gradient(1.2px 1.2px at 72% 14%,#ffffff99 99%,transparent),radial-gradient(1px 1px at 46% 34%,#ffffff80 99%,transparent),radial-gradient(1px 1px at 86% 40%,#ffffff70 99%,transparent),radial-gradient(1px 1px at 30% 60%,#ffffff55 99%,transparent);display:none}
.stage.night .stars{display:block}
.stage .ice,.waves{display:none}
.stage-label{position:absolute;left:18px;top:16px;display:flex;flex-direction:column;gap:2px}
.stage-label b{font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:-.02em}
.stage-label span{font-size:13px;opacity:.75}
.whale-svg{width:70%;max-width:100%;position:relative;z-index:1;overflow:visible;filter:var(--product-shadow);margin-top:24px}

.whale-wrap{transform-origin:50% 60%}
.lv0 .whale-wrap{animation:sway var(--dur,3.2s) ease-in-out infinite}
.lv1 .whale-wrap{animation:bob var(--dur,2.4s) ease-in-out infinite}
.lv2 .whale-wrap{animation:jump var(--dur,1.9s) ease-in-out infinite}
.lv3 .whale-wrap{animation:breach var(--dur,1.7s) ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bob{0%,100%{transform:translateY(4px) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes jump{0%,100%{transform:translateY(10px) rotate(0)}40%{transform:translateY(-26px) rotate(-8deg)}60%{transform:translateY(-22px) rotate(6deg)}}
@keyframes breach{0%,100%{transform:translateY(14px) rotate(4deg)}35%{transform:translateY(-40px) rotate(-16deg)}55%{transform:translateY(-44px) rotate(12deg) scale(1.04)}75%{transform:translateY(0) rotate(-4deg)}}
.spout{opacity:0;transition:opacity .4s}
.lv1 .spout,.lv2 .spout,.lv3 .spout{opacity:1;animation:spout 1.6s ease-in-out infinite}
@keyframes spout{0%,100%{transform:translateY(0) scaleY(.85)}50%{transform:translateY(-4px) scaleY(1.1)}}
.polar .spout path{stroke:#9fc3d8}
@media (prefers-reduced-motion: reduce){.whale-wrap,.spout,.swim{animation:none!important}}

.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lvl{text-align:center;font-size:12px;padding:10px 4px;border-radius:var(--r-md);background:var(--surface-2);color:var(--muted)}
.lvl b{display:block;font-weight:600;font-size:15px;letter-spacing:-.02em;color:var(--ink)}
.lvl.on{background:var(--sea-soft)}
.lvl.on b{color:var(--sea)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:72px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:20px;background:var(--hair);border-radius:var(--pill)}
.week i.today{background:var(--sea)}
.week span{font-size:11px;color:var(--muted)}

.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{border:1px solid transparent;background:var(--surface-2);border-radius:var(--r-lg);padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;text-align:center;letter-spacing:-.01em;transition:transform .12s ease}
.item:active{transform:scale(.96)}
.item svg{width:40px;height:40px}
.item .price{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.item.owned .price{color:var(--good)}
.item.equipped{border:2px solid var(--sea-focus);padding:13px 5px 11px;background:var(--surface)}

/* 세그먼트 컨트롤 */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:var(--r-md);padding:3px;gap:2px}
.seg3{grid-template-columns:repeat(3,1fr)}
.seg4{grid-template-columns:repeat(4,1fr)}.seg4 button{font-size:13px;padding:8px 2px}
.tn-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tn-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sea);background:var(--surface-2);border-radius:999px;padding:4px 10px}
.pcoupon{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r-lg);position:relative;background:var(--surface)}

.pcoupon.soldout{opacity:.5}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface-2);border-radius:var(--r-md);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:24px;font-weight:600;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.hb{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;font-size:14px}
.hb .tr{height:8px;border-radius:var(--pill);background:var(--surface-2);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:var(--pill);background:var(--sea)}

.mbars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:110px;overflow:hidden}

.quote{padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);display:flex;justify-content:space-between;gap:10px;font-size:15px;line-height:1.4}

.repcard{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--sea) 8%,var(--surface)),var(--surface))}

.menu-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);text-align:left;width:100%}

.subtabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.name-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

.name-input{width:100%;box-sizing:border-box;font:inherit;font-size:20px;font-weight:600;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.name-input:focus{outline:2px solid var(--sea);outline-offset:0}

.pc-brand{font-size:13px;font-weight:600;color:var(--muted);margin:4px 0 -2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 6px;font-size:14px;font-weight:400;color:var(--ink);letter-spacing:-.016em}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 0 0 .5px var(--line),0 3px 8px rgba(0,0,0,.08)}

/* 친구 */
.friend{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.friend:last-child{border-bottom:0}
.mini{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.mini svg{width:32px}
.friend .who{min-width:0}
.friend .who b{display:block;font-size:16px;font-weight:600}
.aquarium{position:relative;height:150px;border-radius:var(--r-lg);overflow:hidden;background:#272729}
.swim{position:absolute;width:52px;animation:swim linear infinite;filter:drop-shadow(2px 3px 10px rgba(0,0,0,.35))}
@keyframes swim{from{transform:translateX(-80px)}to{transform:translateX(520px)}}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:var(--pill);padding:10px 16px;font-size:13px;letter-spacing:-.01em}

/* 감사 QR */
.qr-site{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.qr{width:84px;height:84px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--hair);padding:6px}
.tags{display:flex;flex-wrap:wrap;gap:8px}

/* 보상 */

.mile .what b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.mile .what span{font-size:13px;color:var(--muted)}
.by{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:var(--pill);background:var(--surface-2);color:var(--ink-80);margin-top:6px;letter-spacing:-.01em}

.choice{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 16px;border:1px solid var(--hair);border-radius:var(--r-lg);background:var(--surface)}
.choice:has(input:checked){border:2px solid var(--sea-focus);padding:13px 15px}
.choice input{width:20px;height:20px;margin-top:1px;accent-color:var(--sea)}
.choice label{display:flex;flex-direction:column;gap:2px;font-size:16px}
.choice label b{font-weight:600}
.choice label span{font-size:13px;color:var(--muted)}
.mall{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goods{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;display:flex;flex-direction:column}

.benepia{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:18px;border-radius:var(--r-lg);background:var(--surface-2)}

.sponsor{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}

.bar{height:4px;border-radius:var(--pill);background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea)}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center;text-align:center;font-size:12px}
.flow div{background:var(--surface-2);border-radius:var(--r-md);padding:12px 4px;line-height:1.4}

/* 탭바 (frosted) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}

.badge{position:relative;display:inline-flex}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:440px;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.sheet .card{background:var(--surface)!important}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{border:0;background:rgba(120,120,128,.16);color:var(--muted);border-radius:50%;width:30px;height:30px;font-size:17px;line-height:1}
.sharecard{margin:0 auto;border-radius:var(--r-lg);overflow:hidden;position:relative;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:20px;max-width:100%;background:#272729!important}
.sharecard.story{width:250px;aspect-ratio:9/16}

.sharecard .sc-lv{font-size:24px;font-weight:600;letter-spacing:-.02em}
.sharecard .sc-foot{font-size:11px;color:#2997FF}
.share-targets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.stage.room{background:#0F2B40;aspect-ratio:320/220}
.stage.room .stage-label{color:#fff}
.room-svg{width:100%;height:100%;display:block}
.room-svg .weed{transform-box:fill-box;transform-origin:50% 100%;animation:weed 3.4s ease-in-out infinite}
.room-svg .jelly{animation:jelly 3s ease-in-out infinite}
.room-svg .play rect{animation:play 2.6s linear infinite}
@keyframes weed{0%,100%{transform:skewX(-4deg)}50%{transform:skewX(4deg)}}
@keyframes jelly{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes play{from{transform:translateX(0)}to{transform:translateX(180px)}}
.item.locked{opacity:.55}
.sharecard .sc-whale .room-svg{width:100%;border-radius:var(--r-md)}

.stage.tropic{background:linear-gradient(180deg,#5BC0EB 0%,#2289C9 58%,#11649E 100%)}
.stage.polar{background:linear-gradient(180deg,#E3F3FB 0%,#9CCDE8 60%,#5E9DC4 100%);color:#0D2B33}
.stage.night{background:linear-gradient(180deg,#0B1E3F 0%,#123A6B 65%,#0A2A50 100%)}
.stage .reef{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;z-index:0}
.stage .whale-svg{filter:drop-shadow(3px 8px 18px rgba(0,30,60,.35));margin-top:0;margin-bottom:12%}
.reef .weed{transform-box:fill-box;transform-origin:50% 100%;animation:weed 3.4s ease-in-out infinite}

.aquarium .rays{position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 18%,#ffffff1c 18% 24%,transparent 24% 46%,#ffffff14 46% 50%,transparent 50% 72%,#ffffff12 72% 77%,transparent 77%)}
.aquarium .aq-reef{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto}
.swim{z-index:1}
.swim svg{transform:scaleX(-1)}
.bub{position:absolute;bottom:18px;width:6px;height:6px;border-radius:50%;border:1px solid #ffffffaa;background:#ffffff22;animation:bub linear infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-170px);opacity:0}}

  function qrPattern(){var s="",seed=7;function r(){seed=(seed*9301+49297)%233280;return seed/233280}
    function finder(x,y){s+='<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="var(--ink)"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="var(--surface)"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="var(--ink)"/>'}
    finder(0,0);finder(14,0);finder(0,14);
    for(var y=0;y<21;y++)for(var x=0;x<21;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(r()>.55)s+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="var(--ink)"/>'}
    return s}

    if(t.dataset.ad){adSheet(t.dataset.ad);return}
    if(t.id==="adClaim"){var a=ADS.filter(function(x){return x.id===t.dataset.id})[0];clearInterval(adTimer);S.adDone[a.id]=true;closeSheet();earn(a.reward,SPONSORS[a.sp].n+" 미션 완료");return}
    if(t.dataset.quiz!==undefined){if(t.dataset.quiz==="0"){S.adDone.quiz=true;closeSheet();earn(10,"정답이에요")}else{t.disabled=true;toast("다시 골라 보세요. 광고에 힌트가 있어요")}return}
    if(t.dataset.sv){document.querySelectorAll('[data-sv="'+t.dataset.sv+'"]').forEach(function(b){b.setAttribute("aria-pressed",b===t?"true":"false")});
      var ok=document.querySelector('[data-sv="q1"][aria-pressed="true"]')&&document.querySelector('[data-sv="q2"][aria-pressed="true"]');var c=$("#adClaim");if(c&&ok){c.disabled=false;c.textContent="진주 +20 받기"}return}
    if(t.dataset.wmode){S.whaleMode=t.dataset.wmode;render();return}
    if(t.dataset.room){var ri=ROOM.filter(function(x){return x.id===t.dataset.room})[0];
      if(ri.need&&level()<ri.need){toast(ri.n+"은(는) "+LEVELS[ri.need].n+" 단계부터 열려요. 칭찬을 받으면 단계가 올라요");return}
      if(!S.roomOwned[ri.id]){if(S.pearls<ri.p){toast("진주가 "+(ri.p-S.pearls)+"개 부족해요. 칭찬을 보내면 진주가 쌓여요");return}S.pearls-=ri.p;S.roomOwned[ri.id]=true;S.room[ri.id]=false;toast(ri.n+"을(를) 샀어요")}
      var on=!S.room[ri.id];if(on&&ri.slot)ROOM.forEach(function(x){if(x.slot===ri.slot)S.room[x.id]=false});S.room[ri.id]=on;
      render();return}
    if(t.dataset.visit){var name=t.dataset.visit;var preset=name==="민지"?{cinema:true,coral:true,lamp:true,weed:true}:{tv:true,sofa:true,frame:true};
      sheet('<div class="sheet-head"><h2 class="section-title">'+esc(name)+' 님의 바다 방</h2><button class="x" data-close aria-label="닫기">×</button></div>'
       +'<div class="stage room lv'+(name==="민지"?2:0)+'">'+roomSVG(preset,name==="민지"?2:0,true)+'</div>'
       +'<p class="muted">친구 방에서는 구경과 파도 응원만 할 수 있어요. 칭찬 투표는 같은 회사 동료끼리만 해요.</p>'
       +'<button class="btn" id="visitCheer" data-name="'+esc(name)+'">파도 응원 보내기</button>');return}
    if(t.id==="visitCheer"){S.cheered[t.dataset.name]=true;closeSheet();render();toast(t.dataset.name+" 님께 파도 응원을 보냈어요");return}
    if(t.dataset.item){var it=ITEMS.filter(function(x){return x.id===t.dataset.item})[0];
      if(!S.owned[it.id]){if(S.pearls<it.p){toast("진주가 "+(it.p-S.pearls)+"개 부족해요. 칭찬을 보내면 진주가 쌓여요");return}S.pearls-=it.p;S.owned[it.id]=true;toast(it.n+"을(를) 샀어요")}
      if(it.bg){S.bg=S.bg===it.bg?"tropic":it.bg}else{var on=!S.equipped[it.id];if(on&&it.group)ITEMS.forEach(function(x){if(x.group===it.group)S.equipped[x.id]=false});S.equipped[it.id]=on}
      render();return}
    if(t.dataset.mode){S.friendMode=t.dataset.mode;render();return}
    if(t.dataset.rmode){S.rMode=t.dataset.rmode;if(S.rMode==="pearl")S.pMode="coupon";render();return}
    if(t.dataset.claim){claimSheet(+t.dataset.claim);return}
    if(t.id==="confirmClaim"){var n=+t.dataset.n;var m=MILES.filter(function(x){return x.n===n})[0];var sel=document.querySelector('input[name="via"]:checked');var via=sel?sel.value:"coupon";
      S.claimed[n]=true;closeSheet();
      if(via==="benepia"){S.benepiaPts+=m.pts;toast("베네피아에 칭찬 포인트 "+won(m.pts)+"P가 적립됐어요")}
      else{var nm=m.via==="choice"?"온누리편의점 모바일 금액권 "+won(m.pts)+"원":m.title;S.coupons.unshift({n:nm,from:SPONSORS[m.sp].kind==="회사"?"우리 회사 매칭":SPONSORS[m.sp].n+" 제공",when:"방금"});toast(nm+"이(가) 쿠폰함에 도착했어요")}
      render();return}
    if(t.dataset.buy){buySheet(t.dataset.buy,t.dataset.for);return}
    if(t.id==="renameWhale"){nameSheet();return}
    if(t.dataset.sugg){var ni=$("#whaleNameInput");ni.value=t.dataset.sugg;document.querySelectorAll("[data-sugg]").forEach(function(b){b.setAttribute("aria-pressed",b===t)});return}
    if(t.id==="saveName"){var v=($("#whaleNameInput").value||"").trim().slice(0,8);if(!v){toast("이름을 한 글자 이상 적어 주세요");return}S.whaleName=v;closeSheet();render();toast("고래 이름이 '"+v+"'(으)로 바뀌었어요");return}
    if(t.dataset.pmode){S.pMode=t.dataset.pmode;render();return}
    if(t.dataset.gorm){S.rMode=t.dataset.gorm;S.pMode="coupon";go("rewards");return}
    if(t.dataset.repdays){S.repDays=+t.dataset.repdays;render();return}
    if(t.id==="repPreview"){repSheet();return}
    if(t.id==="repMake"){var it=repItems();S.repLinks.unshift({id:Math.random().toString(36).slice(2,6),to:"직접 공유 링크",days:S.repDays,left:S.repDays,views:0,items:it.length?it.join("·"):"기본 정보"});closeSheet();render();toast("평판 링크를 복사했어요 · "+S.repDays+"일 동안 열려요");return}
    if(t.dataset.repok){var q=S.repReqs.filter(function(x){return x.id===t.dataset.repok})[0];S.repReqs=S.repReqs.filter(function(x){return x!==q});S.repLinks.unshift({id:q.id,to:q.co,days:14,left:14,views:1,items:q.items});render();toast(q.co+"에 평판을 보냈어요");return}
    if(t.dataset.repno){var q2=S.repReqs.filter(function(x){return x.id===t.dataset.repno})[0];S.repReqs=S.repReqs.filter(function(x){return x!==q2});render();toast("요청을 거절했어요. 상대에게는 '응답 없음'으로 보여요");return}
    if(t.dataset.repcut){S.repLinks=S.repLinks.filter(function(x){return x.id!==t.dataset.repcut});render();toast("공유를 끊었어요. 링크가 닫혔어요");return}
    if(t.id==="myCert"){toast("회사 이메일 인증이 완료된 상태예요");return}
    if(t.dataset.pc){pcSheet(t.dataset.pc);return}
    if(t.id==="pcConfirm"){var pc=PCOUPONS.filter(function(x){return x.id===t.dataset.id})[0];pcReset();
      if(S.pcWeek>=PC_WEEK||S.pearls<pc.p||pc.stock<=0){closeSheet();toast("지금은 받을 수 없어요");return}
      S.pearls-=pc.p;S.pcWeek+=1;pc.stock-=1;S.pcTaken[pc.id]=(S.pcTaken[pc.id]||0)+1;
      S.coupons.unshift({n:pc.b+" "+pc.n,from:"진주 쿠폰 · 티나는 쿠폰",when:"방금"});
      closeSheet();toast(pc.b+" 할인쿠폰이 쿠폰함에 들어갔어요");render();return}
    if(t.id==="payBuy"){var g=GOODS.filter(function(x){return x.id===t.dataset.id})[0];var ps=document.querySelector('input[name="pay"]:checked');
      if(ps&&ps.value==="pts"){S.benepiaPts-=g.p}
      if(t.dataset.for==="me")S.coupons.unshift({n:g.b+" "+g.n,from:ps&&ps.value==="pts"?"칭찬 포인트 결제":"카드 결제",when:"방금"});
      closeSheet();toast(t.dataset.for==="gift"?g.n+" 쿠폰을 익명으로 선물했어요":g.n+" 쿠폰이 내 쿠폰함에 들어갔어요");render();return}
    if(t.id==="toBenepia"){toast("베네피아 몰로 이동해요");return}
    if(t.id==="sponsorCta"){toast("스폰서 문의가 접수됐어요. 담당자가 연락드릴게요");return}
    if(t.id==="matchCta"){toast("회사 매칭 상담 요청이 접수됐어요");return}
    if(t.dataset.cheer){S.cheered[t.dataset.cheer]=true;render();toast(t.dataset.cheer+" 님께 파도 응원을 보냈어요");return}
    if(t.dataset.thx){S.qrTags[t.dataset.thx]=!S.qrTags[t.dataset.thx];render();return}
    if(t.id==="sendThx"){var fin=function(){S.qrSent++;S.qrTags={};toast("감사를 전했어요. 직원에게 알림이 갔어요");S.qrCoffee=false;render()};
      if(S.qrCoffee)coffeeSheet("OO타워 3층 미화 직원",fin);else fin();return}
  });
  document.addEventListener("mousedown",function(e){var li=e.target.closest("[data-acpick]");if(li){e.preventDefault();acPick(+li.dataset.acpick)}});
  document.addEventListener("input",function(e){if(e.target.id==="acInput"){acIdx=-1;acRender()}});
  document.addEventListener("keydown",function(e){if(e.target.id!=="acInput")return;
    if(e.key==="ArrowDown"&&acRes.length){e.preventDefault();acIdx=(acIdx+1)%acRes.length;acRender()}
    else if(e.key==="ArrowUp"&&acRes.length){e.preventDefault();acIdx=(acIdx-1+acRes.length)%acRes.length;acRender()}
    else if(e.key==="Enter"){e.preventDefault();if(acRes.length)acPick(acIdx>=0?acIdx:0)}
    else if(e.key==="Escape"){e.target.value="";acIdx=-1;acRender()}});
  document.addEventListener("change",function(e){
    if(e.target.id==="coffee")S.coffee=e.target.checked;
    if(e.target.id==="qrCoffee")S.qrCoffee=e.target.checked;
    if(e.target.id==="showCompany"){S.showCompany=e.target.checked;shareSheet()}
    if(e.target.id&&e.target.id.indexOf("rep-")===0){S.rep[e.target.id.slice(4)]=e.target.checked}
    persist();
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("#scrim"))closeSheet();if(e.key==="Enter"&&e.target.id==="whaleNameInput"){var b=$("#saveName");if(b)b.click()}});

  var h=(location.hash||"").slice(1);S.tab=["vote","inbox","whale","friends","qr","rewards","my"].indexOf(h)>=0?h:(h==="ads"?"rewards":"whale");
  if(h==="ads")S.rMode="pearl";if(S.rMode==="pcoupon")S.rMode="pearl";
  render();
  // 동료 칭찬이 실제처럼 가끔 도착
  function incoming(){if(!document.hidden&&!document.querySelector("#scrim"))simulate()}
  setTimeout(function(){incoming();setInterval(incoming,40000)},15000);
})();
</script>

</body>
</html>
